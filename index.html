[...new Set(fixtures.flatMap(x=>[x.home,x.away]))].sort().forEach(t=>{let o=document.createElement('option');o.value=t;o.textContent=t;teamSelect.appendChild(o)});
let selected='2026-08-26';
const dates=[...new Set(fixtures.map(x=>x.date))].sort();
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function render(){
 document.getElementById('date').value=selected;
 let club=teamSelect.value;
 let list=fixtures.filter(x=>x.date===selected && (!club||x.home===club||x.away===club));
 document.getElementById('title').innerHTML='<div class="day">'+fmt(selected)+'</div>';
 let box=document.getElementById('games');
 if(!list.length){box.innerHTML='<div class="empty">No listed fixtures for this date.<br>Use <b>Next Matchday</b> to jump to the next round.</div>';return}
 box.innerHTML='<div class="grid">'+list.map(x=>`<div class="card"><div class="time">${x.time==='TBC'?'Kick-off TBC':x.time+' UK'}</div><div class="teams"><span>${x.home}</span><span class="vs">V</span><span>${x.away}</span></div>${x.tv?`<div class="tv">${x.tv}</div>`:''}</div>`).join('')+'</div>';
}
function shift(dir){
 let i=dates.indexOf(selected); if(i<0)i=dir>0?-1:dates.length;
 selected=dates[Math.max(0,Math.min(dates.length-1,i+dir))]; render();
}
document.getElementById('prev').onclick=()=>shift(-1);
document.getElementById('next').onclick=()=>shift(1);

document.getElementById('nextMatch').onclick=()=>{let now=new Date().toISOString().slice(0,10);selected=dates.find(d=>d>=now)||dates[0];render()};
