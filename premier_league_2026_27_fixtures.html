*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 75% 0,#12365a 0,#07111f 42%,#030812 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.wrap{max-width:1050px;margin:auto;padding:22px}
header{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1px solid #21415f;background:rgba(7,17,31,.88);border-radius:18px;box-shadow:0 15px 50px #0008}
.logo{width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#19a9ff,#073d73);display:grid;place-items:center;font-weight:900;font-size:20px}
h1{margin:0;font-size:27px} .sub{color:var(--muted);margin-top:5px}

button{cursor:pointer;font-weight:700} button:hover{border-color:var(--green)}
.primary{background:#12334b}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:linear-gradient(145deg,rgba(17,38,61,.96),rgba(7,18,31,.96));border:1px solid #1e3b57;border-radius:16px;padding:15px}
.time{font-weight:800;color:var(--green);font-size:16px}.teams{display:flex;justify-content:space-between;gap:15px;margin:10px 0;font-size:17px;font-weight:700}.vs{color:#70849b;font-size:12px;align-self:center}.tv{font-size:12px;color:#8fb7d7}
.day{font-size:19px;font-weight:900;margin:24px 0 10px;color:#fff}
.note{color:var(--muted);font-size:12px;margin-top:18px;line-height:1.5}
@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:12px}h1{font-size:22px}.teams{font-size:16px}}
</style>
</head>
