<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Sports TV Guide — Ireland</title>
<style>
:root{--bg:#050b14;--panel:#0b1624;--panel2:#102238;--line:#1e3853;--text:#f5f7fa;--muted:#91a5ba;--accent:#67e8f9;--green:#7cff7a;--red:#ff5b6e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#143454 0,#07111d 38%,#03070d 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1150px;margin:auto;padding:20px}.hero{padding:22px;border:1px solid var(--line);background:#07121fe8;border-radius:20px;box-shadow:0 18px 60px #0009}
h1{margin:0;font-size:30px}.sub{margin-top:6px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0;padding-bottom:4px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#0b1a2b;color:#fff;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.tabs button.active{background:#123a51;border-color:var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}input,select,button.tool{background:#091728;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.day{font-size:20px;font-weight:800;margin:20px 0 10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:linear-gradient(145deg,#0e2033,#071321);border:1px solid var(--line);border-radius:16px;padding:16px}.time{color:var(--green);font-weight:800}.event{font-size:18px;font-weight:800;margin:8px 0}.meta{color:var(--muted);font-size:13px;line-height:1.6}.watch{margin-top:10px;color:#d9f5ff}.ppv{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:8px;background:#4a1620;color:#ffb8c0;font-size:11px;font-weight:800}.empty{padding:25px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:12px}h1{font-size:24px}}
</style></head>
<body><div class="wrap"><section class="hero"><h1>LIVE SPORTS TV GUIDE</h1><div class="sub">Ireland • Dates, Irish times & where to watch</div></section>
<div class="tabs" id="tabs"></div><div class="tools"><button class="tool" id="prev">‹ Previous</button><button class="tool" id="today">Today</button><button class="tool" id="next">Next ›</button><input id="date" type="date" value="2026-08-26"><select id="cat"><option>All</option></select></div>
<div id="content"></div>
<div class="meta" style="margin-top:22px">Information is based on currently announced schedules and rights. Kick-off/broadcast details can change. “TBC” means the broadcaster or time has not yet been confirmed.</div></div>
<script>
const events=[{"category": "Premier League", "date": "2026-08-28", "time": "20:00", "event": "Crystal Palace vs Manchester City", "watch": "Sky Sports", "ppv": "No", "venue": "Selhurst Park"}, {"category": "Premier League", "date": "2026-08-29", "time": "12:30", "event": "Liverpool vs Nottingham Forest", "watch": "TNT Sports", "ppv": "No", "venue": "Anfield"}, {"category": "Premier League", "date": "2026-08-29", "time": "17:30", "event": "Tottenham Hotspur vs Newcastle United", "watch": "Sky Sports", "ppv": "No", "venue": "Tottenham Hotspur Stadium"}, {"category": "Premier League", "date": "2026-08-30", "time": "14:00", "event": "Chelsea vs Brighton", "watch": "Sky Sports", "ppv": "No", "venue": "Stamford Bridge"}, {"category": "Premier League", "date": "2026-08-30", "time": "16:30", "event": "Manchester United vs Ipswich Town", "watch": "Sky Sports", "ppv": "No", "venue": "Old Trafford"}, {"category": "Celtic FC", "date": "2026-08-29", "time": "14:00", "event": "Celtic vs Falkirk", "watch": "TBC", "ppv": "No", "venue": "Celtic Park"}, {"category": "Celtic FC", "date": "2026-09-02", "time": "18:45", "event": "Celtic vs Aberdeen", "watch": "TBC", "ppv": "No", "venue": "Celtic Park"}, {"category": "Celtic FC", "date": "2026-09-05", "time": "14:00", "event": "St Mirren vs Celtic", "watch": "TBC", "ppv": "No", "venue": "The SMISA Stadium"}, {"category": "Celtic FC", "date": "2026-09-20", "time": "11:00", "event": "Celtic vs Rangers", "watch": "TBC", "ppv": "No", "venue": "Celtic Park"}, {"category": "Champions League", "date": "2026-09-08", "time": "TBC", "event": "UEFA Champions League \u2014 Matchday 1", "watch": "TBC", "ppv": "No", "venue": "Various"}, {"category": "Europa League", "date": "2026-09-16", "time": "TBC", "event": "UEFA Europa League \u2014 Matchday 1", "watch": "TBC", "ppv": "No", "venue": "Various"}, {"category": "Boxing", "date": "2026-09-05", "time": "TBC", "event": "Katie Taylor vs Flora Pili", "watch": "RT\u00c92 / RT\u00c9 Player / RT\u00c9 2FM; DAZN worldwide", "ppv": "No", "venue": "Croke Park, Dublin"}, {"category": "UFC", "date": "2026-09-05", "time": "TBC", "event": "UFC Fight Night \u2014 Hooker vs Parnasse", "watch": "TBC for Ireland; check local listing", "ppv": "No", "venue": "Accor Arena, Paris"}, {"category": "UFC", "date": "2026-09-19", "time": "TBC", "event": "UFC 331 \u2014 Van vs Pantoja 2", "watch": "TBC for Ireland", "ppv": "TBC", "venue": "Crypto.com Arena, Los Angeles"}, {"category": "Darts", "date": "2026-09-01", "time": "TBC", "event": "PDC Darts \u2014 upcoming events", "watch": "Sky Sports / NOW; ITV coverage varies by event", "ppv": "No", "venue": "Various"}, {"category": "Golf", "date": "2026-09-01", "time": "TBC", "event": "PGA Tour / DP World Tour / Major coverage", "watch": "Sky Sports Golf / Sky Sports+ / NOW", "ppv": "No", "venue": "Various"}];
const cats=["All","Premier League","Celtic FC","Champions League","Europa League","Boxing","UFC","Darts","Golf","Live Events"];
let cat="All", selected="2026-08-26";
const tabs=document.getElementById("tabs"), catSel=document.getElementById("cat");
cats.forEach(c=>{let b=document.createElement("button");b.textContent=c;b.onclick=()=>{cat=c;render()};b.dataset.c=c;tabs.appendChild(b);let o=document.createElement("option");o.textContent=c;o.value=c;catSel.appendChild(o)});
function fmt(d){return new Date(d+"T12:00:00").toLocaleDateString("en-IE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.c===cat));
 catSel.value=cat;
 document.getElementById("date").value=selected;
 let list=events.filter(e=>e.date===selected && (cat==="All"||e.category===cat));
 document.getElementById("content").innerHTML='<div class="day">'+fmt(selected)+'</div>'+
 (list.length?'<div class="grid">'+list.map(e=>`<article class="card"><div class="time">${e.time==="TBC"?"Time TBC":e.time+" Irish time"}</div><div class="event">${e.event}</div><div class="meta">📍 ${e.venue}</div><div class="watch">📺 <b>Where to watch:</b> ${e.watch}</div>${e.ppv==="Yes"?'<span class="ppv">PPV • LIVE EVENTS</span>':''}</article>`).join("")+'</div>':'<div class="empty">No confirmed listings for this category/date.</div>');
}
function shift(n){let dates=[...new Set(events.map(e=>e.date))].sort();let i=dates.indexOf(selected);if(i<0)i=n>0?-1:dates.length;selected=dates[Math.max(0,Math.min(dates.length-1,i+n))];render()}
prev.onclick=()=>shift(-1);next.onclick=()=>shift(1);today.onclick=()=>{selected="2026-08-26";render()};date.onchange=e=>{selected=e.target.value;render()};catSel.onchange=e=>{cat=e.target.value;render()};render();
</script></body></html>
